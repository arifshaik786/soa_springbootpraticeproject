
name: laboratory-deployment

services:

  postgresdb:
    image: postgres:16-alpine
    container_name: laboratory-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: soataskdb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d soataskdb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - laboratory-network

  laboratory-service:
    image: arif780/laboratory-service:latest

    build:
      context: .
      dockerfile: Dockerfile

    container_name: laboratory-backend

    ports:
      - "2006:2006"

    depends_on:
      postgresdb:
        condition: service_healthy

    restart: unless-stopped

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresdb:5432/soataskdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root

    networks:
      - laboratory-network

volumes:
  postgres_data:

networks:
  laboratory-network:
    driver: bridge
